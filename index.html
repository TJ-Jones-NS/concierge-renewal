<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Concierge Renewal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .search-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }
        
        .search-box h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        #homeownerSearch {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        
        #homeownerSearch:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .suggestions {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .suggestion-item:last-child {
            border-bottom: none;
        }
        
        .suggestion-item:hover {
            background: #f5f5f5;
        }
        
        .preview-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        
        .preview-header h2 {
            color: #333;
            font-size: 1.8em;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .metric-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .metric-card .value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .jobs-section {
            margin-bottom: 30px;
        }
        
        .jobs-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .job-list {
            list-style: none;
            padding-left: 0;
        }
        
        .job-item {
            padding: 12px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .job-item.done {
            border-left-color: #10b981;
        }
        
        .job-item.outstanding {
            border-left-color: #f59e0b;
        }
        
        .job-item.upcoming {
            border-left-color: #3b82f6;
        }
        
        .job-item strong {
            color: #333;
        }
        
        .job-item .details {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏡 Home Concierge Renewal Generator</h1>
            <p>Search for a homeowner and generate their renewal document</p>
        </div>
        
        <div class="search-box">
            <h2>Select Homeowner</h2>
            <div class="search-input-group">
                <input 
                    type="text" 
                    id="homeownerSearch" 
                    placeholder="Type homeowner name..."
                    autocomplete="off"
                >
                <button class="btn btn-primary" onclick="loadPreview()">Preview</button>
            </div>
            <div class="suggestions" id="suggestions"></div>
        </div>
        
        <div class="preview-box" id="previewBox">
            <div class="preview-header">
                <h2 id="homeownerName"></h2>
                <button class="btn btn-success" onclick="downloadRenewal()">
                    📥 Download Word Document
                </button>
            </div>
            
            <div class="metrics">
                <div class="metric-card">
                    <div class="label">Total Jobs</div>
                    <div class="value" id="totalJobs">0</div>
                </div>
                <div class="metric-card">
                    <div class="label">Hours Saved</div>
                    <div class="value" id="hoursSaved">0</div>
                </div>
                <div class="metric-card">
                    <div class="label">Cost Savings</div>
                    <div class="value" id="costSavings">$0</div>
                </div>
            </div>
            
            <div class="jobs-section">
                <h3>✅ DONE</h3>
                <ul class="job-list" id="doneJobs"></ul>
            </div>
            
            <div class="jobs-section">
                <h3>⏳ Outstanding</h3>
                <ul class="job-list" id="outstandingJobs"></ul>
            </div>
            
            <div class="jobs-section">
                <h3>📋 UPCOMING</h3>
                <ul class="job-list" id="upcomingJobs"></ul>
            </div>
        </div>
    </div>
    
    <script>
        let allHomeowners = {{ homeowners | tojson }};
        let currentHomeowner = null;
        
        const searchInput = document.getElementById('homeownerSearch');
        const suggestionsDiv = document.getElementById('suggestions');
        const previewBox = document.getElementById('previewBox');
        
        // Search functionality
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            
            if (query.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            
            const filtered = allHomeowners.filter(name => 
                name.toLowerCase().includes(query)
            );
            
            if (filtered.length > 0) {
                suggestionsDiv.innerHTML = filtered
                    .map(name => `<div class="suggestion-item" onclick="selectHomeowner('${name}')">${name}</div>`)
                    .join('');
                suggestionsDiv.style.display = 'block';
            } else {
                suggestionsDiv.style.display = 'none';
            }
        });
        
        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
                suggestionsDiv.style.display = 'none';
            }
        });
        
        function selectHomeowner(name) {
            searchInput.value = name;
            currentHomeowner = name;
            suggestionsDiv.style.display = 'none';
            loadPreview();
        }
        
        function loadPreview() {
            const homeowner = searchInput.value.trim();
            
            if (!homeowner) {
                alert('Please enter a homeowner name');
                return;
            }
            
            currentHomeowner = homeowner;
            previewBox.style.display = 'block';
            previewBox.innerHTML = '<div class="loading">Loading preview...</div>';
            
            fetch(`/api/preview/${encodeURIComponent(homeowner)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Homeowner not found');
                    }
                    return response.json();
                })
                .then(data => {
                    displayPreview(data);
                })
                .catch(error => {
                    previewBox.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                });
        }
        
        function displayPreview(data) {
            document.getElementById('homeownerName').textContent = data.homeowner;
            document.getElementById('totalJobs').textContent = data.metrics.total_jobs;
            document.getElementById('hoursSaved').textContent = data.metrics.time_savings;
            document.getElementById('costSavings').textContent = '$' + data.metrics.cost_savings.toFixed(2);
            
            // Display DONE jobs
            const doneList = document.getElementById('doneJobs');
            if (data.done.length > 0) {
                doneList.innerHTML = data.done.map(job => `
                    <li class="job-item done">
                        <strong>${job.project}</strong>
                        <div class="details">Pro: ${job.pro} | Amount: $${job.amount.toFixed(2)}</div>
                    </li>
                `).join('');
            } else {
                doneList.innerHTML = '<li class="empty-state">No completed jobs</li>';
            }
            
            // Display Outstanding jobs
            const outstandingList = document.getElementById('outstandingJobs');
            if (data.outstanding.length > 0) {
                outstandingList.innerHTML = data.outstanding.map(job => `
                    <li class="job-item outstanding">
                        <strong>${job.project}</strong>
                        <div class="details">Status: ${job.status}</div>
                    </li>
                `).join('');
            } else {
                outstandingList.innerHTML = '<li class="empty-state">No outstanding jobs</li>';
            }
            
            // Display Upcoming jobs
            const upcomingList = document.getElementById('upcomingJobs');
            if (data.upcoming.length > 0) {
                upcomingList.innerHTML = data.upcoming.map(job => `
                    <li class="job-item upcoming">
                        <strong>${job.project}</strong>
                    </li>
                `).join('');
            } else {
                upcomingList.innerHTML = '<li class="empty-state">No upcoming jobs</li>';
            }
            
            // Rebuild the preview box with proper structure
            previewBox.innerHTML = `
                <div class="preview-header">
                    <h2>${data.homeowner}</h2>
                    <button class="btn btn-success" onclick="downloadRenewal()">
                        📥 Download Word Document
                    </button>
                </div>
                
                <div class="metrics">
                    <div class="metric-card">
                        <div class="label">Total Jobs</div>
                        <div class="value">${data.metrics.total_jobs}</div>
                    </div>
                    <div class="metric-card">
                        <div class="label">Hours Saved</div>
                        <div class="value">${data.metrics.time_savings}</div>
                    </div>
                    <div class="metric-card">
                        <div class="label">Cost Savings</div>
                        <div class="value">$${data.metrics.cost_savings.toFixed(2)}</div>
                    </div>
                </div>
                
                <div class="jobs-section">
                    <h3>✅ DONE</h3>
                    <ul class="job-list">
                        ${data.done.length > 0 ? data.done.map(job => `
                            <li class="job-item done">
                                <strong>${job.project}</strong>
                                <div class="details">Pro: ${job.pro} | Amount: $${job.amount.toFixed(2)}</div>
                            </li>
                        `).join('') : '<li class="empty-state">No completed jobs</li>'}
                    </ul>
                </div>
                
                <div class="jobs-section">
                    <h3>⏳ Outstanding</h3>
                    <ul class="job-list">
                        ${data.outstanding.length > 0 ? data.outstanding.map(job => `
                            <li class="job-item outstanding">
                                <strong>${job.project}</strong>
                                <div class="details">Status: ${job.status}</div>
                            </li>
                        `).join('') : '<li class="empty-state">No outstanding jobs</li>'}
                    </ul>
                </div>
                
                <div class="jobs-section">
                    <h3>📋 UPCOMING</h3>
                    <ul class="job-list">
                        ${data.upcoming.length > 0 ? data.upcoming.map(job => `
                            <li class="job-item upcoming">
                                <strong>${job.project}</strong>
                            </li>
                        `).join('') : '<li class="empty-state">No upcoming jobs</li>'}
                    </ul>
                </div>
            `;
            
            previewBox.style.display = 'block';
        }
        
        function downloadRenewal() {
            if (!currentHomeowner) {
                alert('Please select a homeowner first');
                return;
            }
            
            window.location.href = `/generate/${encodeURIComponent(currentHomeowner)}`;
        }
        
        // Allow Enter key to trigger preview
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadPreview();
            }
        });
    </script>
</body>
</html>
